<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>

    <!-- Terminal window gradient -->
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>

    <!-- Scan glow -->
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22c55e" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>

    <!-- subtle blur -->
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <!-- rocket path -->
    <path id="flightPath" d="M 140 205 C 260 165, 360 150, 470 135 S 710 95, 790 70" />
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="260" rx="18" fill="url(#bg)"/>

  <!-- Stars -->
  <g opacity="0.9">
    <circle cx="70" cy="55" r="1.5" fill="#e5e7eb">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="30" r="1" fill="#e5e7eb">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="40" r="1.2" fill="#e5e7eb">
      <animate attributeName="opacity" values="0.15;0.95;0.15" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="120" r="1" fill="#e5e7eb">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="35" r="1" fill="#e5e7eb">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="80" r="1.3" fill="#e5e7eb">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Moon -->
  <g>
    <circle cx="820" cy="70" r="26" fill="#e5e7eb" opacity="0.95"/>
    <circle cx="812" cy="64" r="6" fill="#cbd5e1" opacity="0.55"/>
    <circle cx="832" cy="78" r="4" fill="#cbd5e1" opacity="0.45"/>
    <circle cx="828" cy="58" r="3" fill="#cbd5e1" opacity="0.35"/>
  </g>

  <!-- Terminal card -->
  <g>
    <rect x="60" y="55" width="700" height="170" rx="16" fill="url(#term)" stroke="#1f2937" stroke-width="1.5"/>
    <!-- Top bar -->
    <rect x="60" y="55" width="700" height="36" rx="16" fill="#0f172a" opacity="0.85"/>
    <!-- traffic lights -->
    <circle cx="86" cy="73" r="6" fill="#ef4444"/>
    <circle cx="106" cy="73" r="6" fill="#f59e0b"/>
    <circle cx="126" cy="73" r="6" fill="#22c55e"/>

    <!-- prompt text -->
    <text x="86" y="125" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace"
          font-size="18" fill="#e5e7eb" opacity="0.95">
      <tspan x="86" dy="0">$ cat README.md</tspan>
      <tspan x="86" dy="28">ChuxiangboWang / README.md</tspan>
      <tspan x="86" dy="28"></tspan>
      <tspan x="86" dy="28">Welcome!</tspan>
      <tspan x="86" dy="28"></tspan>
      <tspan x="86" dy="28">launching…</tspan>
    </text>

    <!-- blinking cursor -->
    <rect x="200" y="212" width="10" height="18" fill="#22c55e" opacity="0.9">
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- scan line -->
    <g opacity="0.9">
      <rect x="70" y="95" width="680" height="26" fill="url(#scan)" filter="url(#blur)">
        <animate attributeName="y" values="95;185;95" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="70" y="98" width="680" height="2" fill="#22c55e" opacity="0.35">
        <animate attributeName="y" values="98;188;98" dur="2.4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Rocket (ASCII-ish) -->
  <g>
    <g id="rocket" opacity="0.98">
      <!-- flame -->
      <path d="M-10 14 C-26 6, -26 -6, -10 -14 C-18 -2, -18 2, -10 14 Z" fill="#f59e0b" opacity="0.85">
        <animate attributeName="opacity" values="0.35;0.9;0.35" dur="0.18s" repeatCount="indefinite"/>
      </path>
      <!-- body -->
      <path d="M0 -16 C10 -10, 16 0, 10 10 C6 14, 2 16, 0 16 C-2 16, -6 14, -10 10 C-16 0, -10 -10, 0 -16 Z"
            fill="#e5e7eb"/>
      <!-- window -->
      <circle cx="4" cy="-2" r="4" fill="#60a5fa" opacity="0.9"/>
      <!-- fin -->
      <path d="M-8 8 L-18 14 L-6 2 Z" fill="#94a3b8"/>
      <path d="M-8 -8 L-18 -14 L-6 -2 Z" fill="#94a3b8"/>
    </g>

    <!-- Move rocket along path -->
    <animateMotion href="#rocket" dur="3.2s" repeatCount="indefinite" rotate="auto">
      <mpath href="#flightPath"/>
    </animateMotion>
  </g>

  <!-- tiny label -->
  <text x="62" y="34" font-family="ui-monospace, Menlo, Monaco, Consolas, monospace"
        font-size="12" fill="#94a3b8" opacity="0.8">
    README animation • SVG
  </text>
</svg>
