<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>

    <!-- Star template -->
<g id="star">
  <circle cx="0" cy="0" r="1.2" fill="#e5e7eb">
    <animate attributeName="opacity" values="0.15;1;0.15" dur="9s" repeatCount="indefinite"/>
  </circle>
</g>


    <!-- Terminal window gradient -->
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>

    <!-- Scan glow -->
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22c55e" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>

    <!-- subtle blur -->
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <!-- Moon shading -->
    <radialGradient id="moonGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#e5e7eb" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#cbd5e1" stop-opacity="0.95"/>
    </radialGradient>

    <filter id="moonShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Rocket path -->
    <path id="flightPath" d="M 140 205 C 260 165, 360 150, 470 135 S 710 95, 790 70" />
  </defs>

  <!-- ================= Background ================= -->
  <rect x="0" y="0" width="900" height="300" rx="18" fill="url(#bg)"/>

<!-- Stars (many) -->
<g opacity="0.95">
  <!-- top band -->
  <use href="#star" x="50"  y="28"  transform="scale(0.9)"/>
  <use href="#star" x="90"  y="18"  transform="scale(0.7)"/>
  <use href="#star" x="140" y="40"  transform="scale(0.8)"/>
  <use href="#star" x="190" y="22"  transform="scale(0.6)"/>
  <use href="#star" x="240" y="35"  transform="scale(1.0)"/>
  <use href="#star" x="290" y="20"  transform="scale(0.7)"/>
  <use href="#star" x="340" y="42"  transform="scale(0.85)"/>
  <use href="#star" x="390" y="26"  transform="scale(0.65)"/>
  <use href="#star" x="440" y="38"  transform="scale(0.75)"/>
  <use href="#star" x="490" y="18"  transform="scale(0.6)"/>
  <use href="#star" x="540" y="30"  transform="scale(0.8)"/>
  <use href="#star" x="590" y="22"  transform="scale(0.7)"/>
  <use href="#star" x="640" y="44"  transform="scale(0.9)"/>
  <use href="#star" x="690" y="20"  transform="scale(0.65)"/>
  <use href="#star" x="740" y="36"  transform="scale(0.75)"/>
  <use href="#star" x="790" y="24"  transform="scale(0.7)"/>
  <use href="#star" x="850" y="32"  transform="scale(0.85)"/>

  <!-- mid band -->
  <use href="#star" x="70"  y="70"  transform="scale(0.7)"/>
  <use href="#star" x="120" y="90"  transform="scale(0.9)"/>
  <use href="#star" x="170" y="76"  transform="scale(0.6)"/>
  <use href="#star" x="220" y="98"  transform="scale(0.8)"/>
  <use href="#star" x="270" y="74"  transform="scale(0.7)"/>
  <use href="#star" x="320" y="92"  transform="scale(0.65)"/>
  <use href="#star" x="370" y="78"  transform="scale(0.85)"/>
  <use href="#star" x="420" y="96"  transform="scale(0.75)"/>
  <use href="#star" x="470" y="72"  transform="scale(0.6)"/>
  <use href="#star" x="520" y="90"  transform="scale(0.8)"/>
  <use href="#star" x="570" y="76"  transform="scale(0.7)"/>
  <use href="#star" x="620" y="98"  transform="scale(0.9)"/>
  <use href="#star" x="670" y="74"  transform="scale(0.65)"/>
  <use href="#star" x="720" y="92"  transform="scale(0.75)"/>
  <use href="#star" x="770" y="78"  transform="scale(0.7)"/>
  <use href="#star" x="830" y="96"  transform="scale(0.85)"/>

  <!-- lower band (avoid covering terminal too much; keep left/right edges) -->
  <use href="#star" x="40"  y="140" transform="scale(0.7)"/>
  <use href="#star" x="85"  y="160" transform="scale(0.6)"/>
  <use href="#star" x="120" y="135" transform="scale(0.75)"/>
  <use href="#star" x="820" y="140" transform="scale(0.7)"/>
  <use href="#star" x="860" y="165" transform="scale(0.6)"/>
</g>


  <!-- Moon (more realistic) -->
  <g filter="url(#moonShadow)">
    <circle cx="820" cy="70" r="26" fill="url(#moonGrad)" opacity="0.98"/>
    <ellipse cx="832" cy="78" rx="20" ry="18" fill="#94a3b8" opacity="0.12"/>

    <g opacity="0.75">
      <circle cx="812" cy="64" r="6.3" fill="#cbd5e1" opacity="0.55"/>
      <circle cx="810.5" cy="62.8" r="2.2" fill="#ffffff" opacity="0.35"/>
      <circle cx="814" cy="66" r="2.6" fill="#94a3b8" opacity="0.22"/>

      <circle cx="832" cy="78" r="4.6" fill="#cbd5e1" opacity="0.48"/>
      <circle cx="830.8" cy="77" r="1.6" fill="#ffffff" opacity="0.32"/>
      <circle cx="833.5" cy="79.2" r="2.0" fill="#94a3b8" opacity="0.18"/>

      <circle cx="828" cy="58" r="3.4" fill="#cbd5e1" opacity="0.42"/>
      <circle cx="827" cy="57" r="1.2" fill="#ffffff" opacity="0.30"/>
      <circle cx="829.2" cy="59" r="1.6" fill="#94a3b8" opacity="0.16"/>
    </g>

    <!-- slight shimmer (slow x3: 4.8 -> 14.4) -->
    <circle cx="820" cy="70" r="26" fill="#ffffff" opacity="0.03">
      <animate attributeName="opacity" values="0.02;0.05;0.02" dur="14.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= Terminal ================= -->
  <g>
    <rect x="60" y="55" width="700" height="200" rx="16" fill="url(#term)" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="60" y="55" width="700" height="36" rx="16" fill="#0f172a" opacity="0.85"/>
    <circle cx="86" cy="73" r="6" fill="#ef4444"/>
    <circle cx="106" cy="73" r="6" fill="#f59e0b"/>
    <circle cx="126" cy="73" r="6" fill="#22c55e"/>

    <!-- One full story cycle:
         - launching finishes at t=0.42 of cycle
         - rocket launches immediately at that moment
         - rocket reaches moon at t=1 => everything restarts
         Total cycle dur = 19.2s (slow x3 of original 6.4s)
    -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace"
       font-size="18" fill="#e5e7eb" opacity="0.95">

      <!-- Line 1 -->
      <text x="86" y="124" opacity="0">$ cat README.md
        <animate attributeName="opacity"
                 values="0;1;1;0"
                 keyTimes="0;0.08;0.98;1"
                 dur="19.2s" repeatCount="indefinite"/>
      </text>

      <!-- Line 2 -->
      <text x="86" y="150" opacity="0">ChuxiangboWang / README.md
        <animate attributeName="opacity"
                 values="0;0;1;1;0"
                 keyTimes="0;0.10;0.18;0.98;1"
                 dur="19.2s" repeatCount="indefinite"/>
      </text>

      <!-- Line 3 -->
      <text x="86" y="176" opacity="0">This is Chuxiangbo&apos;s GitHub, welcome!
        <animate attributeName="opacity"
                 values="0;0;1;1;0"
                 keyTimes="0;0.18;0.30;0.98;1"
                 dur="19.2s" repeatCount="indefinite"/>
      </text>

      <!-- Line 4: Launching… (typed chunks, ends exactly at 0.42 => rocket launches) -->
      <g>
        <text x="86" y="214" opacity="0">L
          <animate attributeName="opacity" values="0;0;1;1;0"
                   keyTimes="0;0.32;0.34;0.98;1" dur="19.2s" repeatCount="indefinite"/>
        </text>
        <text x="86" y="214" opacity="0">La
          <animate attributeName="opacity" values="0;0;1;1;0"
                   keyTimes="0;0.34;0.36;0.98;1" dur="19.2s" repeatCount="indefinite"/>
        </text>
        <text x="86" y="214" opacity="0">Laun
          <animate attributeName="opacity" values="0;0;1;1;0"
                   keyTimes="0;0.36;0.38;0.98;1" dur="19.2s" repeatCount="indefinite"/>
        </text>
        <text x="86" y="214" opacity="0">Launch
          <animate attributeName="opacity" values="0;0;1;1;0"
                   keyTimes="0;0.38;0.40;0.98;1" dur="19.2s" repeatCount="indefinite"/>
        </text>
        <text x="86" y="214" opacity="0">Launching…
          <animate attributeName="opacity" values="0;0;1;1;0"
                   keyTimes="0;0.40;0.42;0.98;1" dur="19.2s" repeatCount="indefinite"/>
        </text>
      </g>
    </g>

<!-- Single moving cursor: visible ONLY during typing window; blinks; moves right -->
<rect id="cursor" x="98" y="200" width="10" height="18" fill="#22c55e" opacity="0.9">
  <!-- show only during 0.32~0.42 -->
  <animate attributeName="display"
           dur="19.2s" repeatCount="indefinite"
           values="none; inline; none"
           keyTimes="0; 0.32; 0.42" />

  <!-- blink while visible (this runs always, but display hides it outside window) -->
  <animate attributeName="opacity"
           values="0;1;0" dur="0.9s"
           repeatCount="indefinite"/>

  <!-- move right in steps during typing -->
  <animate attributeName="x"
           dur="19.2s" repeatCount="indefinite"
           calcMode="discrete"
           values="98;110;130;160;210"
           keyTimes="0;0.34;0.36;0.38;0.40"/>
</rect>





    <!-- scan line (slow x3: 2.4 -> 7.2) -->
    <g opacity="0.9">
      <rect x="70" y="95" width="680" height="26" fill="url(#scan)" filter="url(#blur)">
        <animate attributeName="y" values="95;185;95" dur="12s" repeatCount="indefinite"/>
      </rect>
      <rect x="70" y="98" width="680" height="2" fill="#22c55e" opacity="0.35">
        <animate attributeName="y" values="98;188;98" dur="12s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- ================= Rocket ================= -->
  <g>
    <g id="rocket" opacity="0">
      <!-- flame (slow x3: 0.18 -> 0.54) -->
      <path d="M-10 14 C-26 6, -26 -6, -10 -14 C-18 -2, -18 2, -10 14 Z" fill="#f59e0b" opacity="0.85">
        <animate attributeName="opacity" values="0.35;0.9;0.35" dur="0.54s" repeatCount="indefinite"/>
      </path>
      <!-- body -->
      <path d="M0 -16 C10 -10, 16 0, 10 10 C6 14, 2 16, 0 16 C-2 16, -6 14, -10 10 C-16 0, -10 -10, 0 -16 Z"
            fill="#e5e7eb"/>
      <!-- window -->
      <circle cx="4" cy="-2" r="4" fill="#60a5fa" opacity="0.9"/>
      <!-- fins -->
      <path d="M-8 8 L-18 14 L-6 2 Z" fill="#94a3b8"/>
      <path d="M-8 -8 L-18 -14 L-6 -2 Z" fill="#94a3b8"/>
    </g>

    <!-- Rocket appears exactly when launching… completes (0.42 of the cycle) -->
    <animate href="#rocket" attributeName="opacity"
             values="0;0;1;1;0"
             keyTimes="0;0.419;0.42;0.999;1"
             dur="19.2s" repeatCount="indefinite" />

    <!-- Rocket waits at start until 0.42, then flies to the moon by the end of cycle.
         When it reaches the end (t=1), the whole animation restarts automatically. -->
    <animateMotion href="#rocket"
                   dur="19.2s"
                   repeatCount="indefinite"
                   rotate="auto"
                   calcMode="linear"
                   keyTimes="0;0.42;1"
                   keyPoints="0;0;1">
      <mpath href="#flightPath"/>
    </animateMotion>
  </g>

  <!-- tiny label -->
  <text x="62" y="34" font-family="ui-monospace, Menlo, Monaco, Consolas, monospace"
        font-size="12" fill="#94a3b8" opacity="0.8">
    “To infinity and beyond!”
  </text>
</svg>
